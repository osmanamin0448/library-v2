<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODIN Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<div class="header">
			<div class="logo-container">
				<img class="logo" src="./img/odin-logo.png" alt="odin-logo">

				<h1>ODIN LIBRARY</h1>
			</div>

			<button class="new-book">NEW BOOK</button>
		</div>

		<div class="main-content">
			<img class="shelve-image" src="./img/peter-herrmann-aT88kga0g_M-unsplash.jpg" alt="shelve-image">

			<dialog>
				<form>
					<div>
						<label for="title">Title *</label>
						<input type="text" name="title" id="title" required>
					</div>
					<div>
						<label for="author">Author *</label>
						<input type="text" name="author" id="author" required>
					</div>
					<div>
						<label for="pages">Pages *</label>
						<input type="number" name="pages" id="pages" required>
					</div>
					<div class="checkbox-div">
						<label for="read">Have you read this book?</label>
						<input type="checkbox" name="read" id="read">
					</div>
					<div class="buttons-div">
						<button class="add-book" >Add</button>
						<button class="cancel-btn">Cancel</button>
					</div>
				</form>
			</dialog>

			<div class="shelve"></div>

		</div>

		<div class="footer">
				<strong>Copyright 2026 by Osman Amin</strong>
		</div>
	</div>

	<script src="script.js"></script>
</body>
</html>
